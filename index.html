<!DOCTYPE html>
<html lang="ca">
<head>
  <title>Repositoris de GitHub</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<div class="container mt-3">

  <h2>Repositoris de GitHub</h2>
  <p>Escriu un nom d'usuari de GitHub i prem el botó.</p>

  <div class="mb-3">
    <label for="usuari" class="form-label">Usuari:</label>
    <input type="text" class="form-control" id="usuari">
  </div>
  <button id="boto" class="btn btn-primary">Mostra els repositoris</button>

  <div id="error" class="alert alert-danger mt-3" style="display:none">
    No s'ha trobat aquest usuari.
  </div>

  <table class="table table-striped mt-3">
    <thead class="table-dark">
      <tr>
        <th>Nom</th>
        <th>Descripció</th>
        <th>Seguidors (estrelles)</th>
      </tr>
    </thead>
    <tbody id="files">
    </tbody>
  </table>

</div>

<script>
$(document).ready(function(){

  $("#boto").click(function(){

    var usuari = $("#usuari").val();

    $("#files").empty();
    $("#error").hide();

    $.get("https://api.github.com/users/" + usuari + "/repos", function(repos){

      $.each(repos, function(i, repo){
        var descripcio = repo.description;
        if (descripcio == null) {
          descripcio = "";
        }
        $("#files").append(
          "<tr>" +
            "<td>" + repo.name + "</td>" +
            "<td>" + descripcio + "</td>" +
            "<td>" + repo.stargazers_count + "</td>" +
          "</tr>"
        );
      });

    }).fail(function(){
      $("#error").show();
    });

  });

});
</script>

</body>
</html>
